name = "bzip2"
version = "0.1.0"
defaultTargets = ["Bzip2Spec", "Bzip2Oracle", "Bzip2Proofs", "Bzip2UnitTests", "bzip2-oracle"]
testDriver = "bzip2_tests"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
# Mathlib's style linters, where Mathlib is imported (spec, proofs); `weak.`: ignored elsewhere.
# tools/verify.sh fails on any warning they, or Lean's own linters, report (STYLE.md).
weak.linter.style.longLine = true
weak.linter.style.cdot = true
weak.linter.style.lambdaSyntax = true
weak.linter.style.dollarSyntax = true
weak.linter.style.multiGoal = true
weak.linter.style.refine = true
weak.linter.style.cases = true
weak.linter.style.induction = true
weak.linter.style.missingEnd = true
weak.linter.style.setOption = true
weak.linter.style.openClassical = true
weak.linter.oldObtain = true
weak.linter.flexible = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

# Every library builds all the modules under its root by glob: a part is added by adding its
# file, and no shared file lists the parts (lists like that conflict between parallel changes).

# The specification: what a bzip2 stream is and what it decodes to. Imports Mathlib only.
[[lean_lib]]
name = "Bzip2Spec"
srcDir = "spec"
roots = ["Bzip2.Spec"]
globs = ["Bzip2.Spec.*"]

# The oracle: the executable Lean implementation. Must not import Bzip2.Spec or Bzip2.Proofs.
[[lean_lib]]
name = "Bzip2Oracle"
srcDir = "oracle"
roots = ["Bzip2.Oracle"]
globs = ["Bzip2.Oracle.*"]

# Proofs that the oracle meets the specification.
[[lean_lib]]
name = "Bzip2Proofs"
srcDir = "proofs"
roots = ["Bzip2.Proofs"]
globs = ["Bzip2.Proofs.*"]

# Unit tests: one module per part, tests/Bzip2/Test/<Part>.lean, made of `#guard` and `example`,
# so building them runs them.
[[lean_lib]]
name = "Bzip2UnitTests"
srcDir = "tests"
roots = ["Bzip2.Test"]
globs = ["Bzip2.Test.+"]

# `bzip2-oracle -z|-d [-1..-9]`: the oracle as a filter, stdin to stdout.
[[lean_exe]]
name = "bzip2-oracle"
srcDir = "oracle"
root = "Bzip2.Cli"

# `lake test`: the golden vectors in tests/vectors (tests/Bzip2/Tests.lean, task bzip2/tests/golden).
[[lean_exe]]
name = "bzip2_tests"
srcDir = "tests"
root = "Bzip2.Tests"
